<div class="dashboard-page">
  <header class="topbar">
    <a class="brand" routerLink="/productos"><span>GP</span> Gestor de productos</a>
    <div class="session-controls">
      @if (auth.session(); as session) {
        <span class="session-label"><span class="role-mark" [class.admin-mark]="auth.esAdmin()"></span>{{ session.username }} · {{ auth.esAdmin() ? 'Admin' : 'Invitado' }}</span>
        <button class="text-button" type="button" (click)="salir()">Cerrar sesión</button>
      } @else {
        <span class="session-label">Explorando como invitado</span>
        <a class="text-button" routerLink="/login">Ingresar</a>
        <a class="join-button" routerLink="/register">Crear cuenta</a>
      }
    </div>
  </header>

  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
      <app-filtros-productos></app-filtros-productos>
    </aside>
    <main class="dashboard-content">
      <app-lista-productos></app-lista-productos>
    </main>
  </div>
</div>
