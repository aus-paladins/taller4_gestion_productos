<div class="filtros-container">
  <h3 class="filtros-titulo">Filtros de Búsqueda</h3>

  <!-- Búsqueda Libre -->
  <div class="filtro-grupo">
    <label for="buscar">Buscar producto o SKU</label>
    <input
      pInputText
      id="buscar"
      [(ngModel)]="busqueda"
      (ngModelChange)="onBusquedaChange($event)"
      placeholder="Ej: Campera..."
      class="w-full" />
  </div>

  <!-- Departamento -->
  <div class="filtro-grupo">
    <label for="departamento">Departamento</label>
    <p-select
      [options]="departamentos"
      [(ngModel)]="departamentoSeleccionado"
      (ngModelChange)="onDepartamentoChange($event)"
      optionLabel="nombre"
      optionValue="id"
      placeholder="Todos los departamentos"
      [showClear]="true"
      styleClass="w-full">
    </p-select>
  </div>

  <!-- Rango de Precios -->
  <div class="filtro-grupo">
    <label>Rango de Precio</label>
    <div class="rango-precio">
      <!-- p-inputNumber permite formatear monedas automáticamente -->
      <p-inputNumber
        [(ngModel)]="precioMin"
        (ngModelChange)="onPrecioMinChange($event)"
        placeholder="Mín ($)"
        mode="currency"
        currency="ARS"
        locale="es-AR">
      </p-inputNumber>
      <span>-</span>
      <p-inputNumber
        [(ngModel)]="precioMax"
        (ngModelChange)="onPrecioMaxChange($event)"
        placeholder="Máx ($)"
        mode="currency"
        currency="ARS"
        locale="es-AR">
      </p-inputNumber>
    </div>
  </div>

  <!-- Filtro de Stock (Checkbox) -->
  <div class="filtro-grupo checkboxes">
    <div class="checkbox-item">
      <p-checkbox
        [(ngModel)]="soloConStock"
        (ngModelChange)="onStockChange($event)"
        [binary]="true"
        inputId="stock">
      </p-checkbox>
      <label for="stock">Solo productos con stock</label>
    </div>
    <div class="checkbox-item">
      <p-checkbox
        [(ngModel)]="soloSinStock"
        (ngModelChange)="onSinStockChange($event)"
        [binary]="true"
        inputId="sinStock">
      </p-checkbox>
      <label for="sinStock">Solo productos sin stock</label>
    </div>
  </div>

  <!-- Ordenamiento -->
  <div class="filtro-grupo">
    <label for="ordenar">Ordenar por</label>
    <p-select
      [options]="opcionesOrden"
      [(ngModel)]="ordenSeleccionado"
      (ngModelChange)="onOrdenChange($event)"
      optionLabel="label"
      optionValue="value"
      styleClass="w-full">
    </p-select>
  </div>

  <div class="filtro-grupo checkboxes filtro-admin">
    <div class="checkbox-item">
      <p-checkbox
        [(ngModel)]="mostrarInactivos"
        (ngModelChange)="onMostrarInactivosChange($event)"
        [binary]="true"
        inputId="inactivos">
      </p-checkbox>
      <label for="inactivos">Mostrar productos inactivos</label>
    </div>
  </div>

  <button class="btn-secundario">Limpiar Filtros</button>
</div>
